<!doctype html>
<html lang="pt">
  <head>
    <!-- Metadados e recursos -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título, descrição e Open Graph por defeito. No build, scripts/generate-pages.mjs
         substitui-os pelos de cada página (definidos em src/seo/pages.js). -->
    <title>Casttêdo Valley | Vinhos DOC Douro e Azeite Biológico</title>
    <!-- Favicon (ícone da aba) e ícone no ecrã principal do iPhone -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Vinhos DOC Douro e azeite virgem extra biológico de um produtor familiar em Castedo, Alijó, com lagares de granito de 1873.">
    <!-- Open Graph (partilha em redes sociais) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Casttêdo Valley">
    <meta property="og:title" content="Casttêdo Valley | Vinhos DOC Douro e Azeite Biológico">
    <meta property="og:image" content="https://www.casttedovalley.com/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Excluir as visitas de um dispositivo das estatísticas (?umami=off): ver public/umami-optout.js -->
    <script src="/umami-optout.js"></script>
    <!-- Estatísticas (Umami, sem cookies). Só conta visitas no domínio de produção -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="70cc13c0-f34d-4064-8f1a-9bee18e144d4"
      data-domains="www.casttedovalley.com,casttedovalley.com"
    ></script>
  </head>
  <body>
    <!-- Container raiz do React -->
    <div id="root"></div>
    <!-- Script que inicia a aplicação -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
