<!doctype html>
<html lang="pt">
  <head>
    <!-- Metadados e recursos -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casttêdo Valley</title>
    <!-- Favicon (ícone da aba) -->
    <link rel="icon" href="./src/assets/cv-logo-castanho.svg" />
    <!-- Meta descrição (SEO) -->
    <meta name="description" content="Vinhos de excelência DOC Douro.">
    <!-- Open Graph (partilha em redes sociais) -->
    <meta property="og:title" content="Casttêdo Valley - DOC Douro">
    <meta property="og:image" content="./src/assets/cv-logo-castanho.webp">
    <!-- Excluir as visitas de um dispositivo das estatísticas: abrir o site com ?umami=off
         (e ?umami=on para voltar a contar). Fica guardado no browser desse dispositivo. -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var value = params.get('umami');
          if (value !== 'off' && value !== 'on') return;

          if (value === 'off') localStorage.setItem('umami.disabled', '1');
          else localStorage.removeItem('umami.disabled');

          // Tira o parâmetro do endereço para não ficar no histórico nem ser partilhado
          params.delete('umami');
          var query = params.toString();
          history.replaceState(null, '', location.pathname + (query ? '?' + query : '') + location.hash);

          alert(value === 'off'
            ? 'As visitas deste dispositivo deixaram de ser contadas nas estatísticas.'
            : 'As visitas deste dispositivo voltaram a ser contadas nas estatísticas.');
        } catch (e) {}
      })();
    </script>
    <!-- Estatísticas (Umami, sem cookies). Só conta visitas no domínio de produção -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="70cc13c0-f34d-4064-8f1a-9bee18e144d4"
      data-domains="www.casttedovalley.com,casttedovalley.com"
    ></script>
  </head>
  <body>
    <!-- Container raiz do React -->
    <div id="root"></div>
    <!-- Script que inicia a aplicação -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
