# Propõe atualizações de dependências como PRs (agrupadas, para não haver um PR por pacote).
# Cada PR passa pela verificação do CI (.github/workflows/ci.yml) e pela pré-visualização do Cloudflare.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      atualizacoes-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
